<form #cityForm="ngForm" (ngSubmit)="onSubmit(cityForm)" class="space-y-4" novalidate>
    <div>
      <label for="name" class="block font-semibold">Ciudad</label>
      <input
        id="name"
        type="text"
        name="name"
        placeholder="Madrid"
        autocomplete="address-level2"
        class="w-full border rounded px-3 py-2"
        [(ngModel)]="city.name"
        #name="ngModel"
        required
        minlength="2"
      />
      @if (name.touched && name.errors?.['required']) {
        <span class="text-sm text-red-500">El nombre es obligatorio.</span>
      }
      @if (name.touched && name.errors?.['minlength']) {
        <span class="text-sm text-red-500">Mínimo 2 caracteres.</span>
      }
    </div>
  
    <div>
      <label for="country" class="block font-semibold">País</label>
      <input
        id="country"
        type="text"
        name="country"
        placeholder="España"
        autocomplete="country-name"
        class="w-full border rounded px-3 py-2"
        [(ngModel)]="city.country"
        #country="ngModel"
        required
      />
      @if (country.touched && country.errors?.['required']) {
        <span class="text-sm text-red-500">El país es obligatorio.</span>
      }
    </div>
  
    <div>
      <label for="description" class="block font-semibold">Descripción</label>
      <textarea
        id="description"
        name="description"
        rows="3"
        placeholder="Una ciudad con mucho viento…"
        class="w-full border rounded px-3 py-2"
        [(ngModel)]="city.description"
      ></textarea>
    </div>
  
    <div>
      <label for="image" class="block font-semibold">URL de la imagen</label>
      <input
        id="image"
        type="url"
        name="image"
        placeholder="https://…"
        class="w-full border rounded px-3 py-2"
        [(ngModel)]="city.image"
      />
    </div>
  
    <button
      type="submit"
      class="rounded bg-blue-600 px-4 py-2 text-white disabled:opacity-50"
      [disabled]="cityForm.invalid"
    >
      Guardar
    </button>
  </form>
  
  <p class="mt-4 text-sm text-gray-600">
    Vista previa: {{ city.name }} · {{ city.country }}
  </p>
