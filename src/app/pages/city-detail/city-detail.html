<div class="flex justify-center items-center min-h-screen">
@if(city(); as currentCity){
    <div class="flex flex-col items-center gap-4">
        <app-city-card [city]="currentCity"></app-city-card>
        <!-- La temperatura viene de WeatherService; de momento es un valor dummy. -->
        @if (temperature() !== null) {
            <p class="text-lg font-semibold">Temperatura actual: {{ temperature() }} °C</p>
        }
    </div>
}
@else {
    <p>Ciudad no encontrada</p>
}
</div>
